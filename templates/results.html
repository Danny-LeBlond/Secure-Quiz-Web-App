<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 2rem;
            text-align: center;
        }
        h2 {
            color: #28a745;
            margin-bottom: 1rem;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 90%;
            max-width: 600px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.5rem;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .correct {
            color: green;
            font-weight: bold;
        }
        .incorrect {
            color: red;
            font-weight: bold;
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Quiz Complete</h2>
    <p>Your Score: {{ score }} out of {{ total }}</p>

    <table>
        <tr>
            <th>Question</th>
            <th>Your Answer</th>
            <th>Correct Answer</th>
        </tr>
        <tbody>
            {% for r in responses %}
            <tr>
                <td>{{ r.text }}</td>
                <td class="{% if r.choice == r.correct_choice %}correct{% else %}incorrect{% endif %}">{{ r.choice }}</td>
                <td>{{ r.correct_choice }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/dashboard">Return to Dashboard</a>
</body>
</html>
