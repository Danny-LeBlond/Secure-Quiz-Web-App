

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Quiz Attempts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }
        th, td {
            padding: 0.75rem;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #17a2b8;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        a {
            text-decoration: none;
            color: white;
            background-color: #28a745;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            margin: 0.2rem;
        }
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Admin Dashboard - Manage Quiz Attempts</h1>

    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Score</th>
                <th>Timestamp</th>
                <th>View Details</th>
            </tr>
        </thead>
        <tbody>
            {% for attempt in attempts %}
            <tr>
                <td>{{ attempt.user.username }}</td>
                <td>{{ attempt.score }}</td>
                <td>{{ attempt.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                <td>
                    <a href="{{ url_for('view_attempt', id=attempt.id) }}">View Attempt</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{{ url_for('welcome') }}" style="background-color: #007bff;">Back to Home</a>
</body>
</html>
